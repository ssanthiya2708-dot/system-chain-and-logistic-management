<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Supply Chain Logistics System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="login-box">
        <h2>Supply Chain Portal</h2>
        <p>Logistics & Inventory Management System</p>

        <div id="login-alert" class="alert alert-error"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username (e.g. admin)" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password (e.g. admin123)" required>
            </div>

            <button type="submit">Sign In to Dashboard</button>
        </form>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
